name: Build IsoCam ASI

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Compilador C++ 32-bit
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compilar IsoCam.asi
        run: cl /EHsc /LD /O2 main.cpp user32.lib /link /OUT:IsoCam.asi

      - name: Disponibilizar IsoCam.asi para Download
        uses: actions/upload-artifact@v4
        with:
          name: IsoCam-ASI
          path: IsoCam.asi
